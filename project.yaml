name: 2026.10.30_Paper10.1_iso-1e6_PHITS
tool: PHITS
description: 'Paper 10.1 (PNE 2022) - PHITS, 1e+06 hạt/job. NGUỒN ĐIỂM ĐẲNG HƯỚNG
  (4π) tại gốc toạ độ như bài báo mục 2.2 (''point isotropic source''), thay cho chùm
  song song +z của bản 2026.10.29. Hình học, vật liệu, tally, vật lý giữ nguyên. Chỉ
  ~2.5e-5 số hạt lọt qua lỗ chuẩn trực (năng lượng thấp) nên thống kê kém hơn chùm
  song song rất nhiều. Sao chép từ 2026.10.29_Paper10.1_1e6_PHITS (đã gồm các sửa
  lỗi ngày 2026-10-29). Hình học 2026-10-30b: ống chuẩn trực Pb z 10–45 (lỗ r 2, vỏ
  r 3, khe 5 cm tới mẫu), mẫu r 5, detector r 10 (V 628.3185 cm3), vỏ Pb z 45–75 r
  13–15, nắp Pb z 75–77 r 0–15. Lỗ 2 cm (nón θ ≈ 2.5°) cho ~5e-4 photon lọt qua, gấp
  ~20 lần lỗ 0.5 cm cũ.'
primaries: 1000000
runners_per_account: 10
timeout_minutes: 340
max_rescue_rounds: 3
